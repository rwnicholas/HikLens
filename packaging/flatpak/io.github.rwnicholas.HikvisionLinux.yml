app-id: io.github.rwnicholas.HikvisionLinux
branch: stable
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: hikvision-linux
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-data/Steam:rw
  - --filesystem=~/.steam:rw
modules:
  - name: hikvision-linux
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - python3 -m pip install --disable-pip-version-check --no-cache-dir --target=/app/lib/hikvision-python -r requirements.txt
      - install -Dm755 hikvision-linux.sh /app/bin/hikvision-linux
      - install -Dm644 cam_viewer.py /app/share/hikvision-linux/cam_viewer.py
      - install -Dm644 capture_backends.py /app/share/hikvision-linux/capture_backends.py
      - install -Dm644 hikvision_backend.py /app/share/hikvision-linux/hikvision_backend.py
      - install -Dm644 hikvision_sdk.py /app/share/hikvision-linux/hikvision_sdk.py
      - install -Dm644 steam_deck.py /app/share/hikvision-linux/steam_deck.py
      - install -d /app/share/hikvision-linux/hikvision-sdk
      - install -Dm644 Makefile /app/share/hikvision-linux/hikvision-sdk/Makefile
      - install -Dm644 sdk_stream_test.cpp /app/share/hikvision-linux/hikvision-sdk/sdk_stream_test.cpp
      - make -C /app/share/hikvision-linux/hikvision-sdk portable-helper HELPER=/app/lib/hikvision-camera-viewer/hikvision_stream_helper
      - install -Dm644 io.github.rwnicholas.HikvisionLinux.desktop /app/share/applications/io.github.rwnicholas.HikvisionLinux.desktop
      - install -Dm644 io.github.rwnicholas.HikvisionLinux.svg /app/share/icons/hicolor/scalable/apps/io.github.rwnicholas.HikvisionLinux.svg
      - install -Dm644 io.github.rwnicholas.HikvisionLinux.appdata.xml /app/share/metainfo/io.github.rwnicholas.HikvisionLinux.appdata.xml
    sources:
      - type: file
        path: ../../cam_viewer.py
      - type: file
        path: ../../capture_backends.py
      - type: file
        path: ../../hikvision_backend.py
      - type: file
        path: ../../hikvision_sdk.py
      - type: file
        path: ../../steam_deck.py
      - type: file
        path: ../../hikvision-sdk/Makefile
      - type: file
        path: ../../hikvision-sdk/sdk_stream_test.cpp
      - type: file
        path: ../../requirements.txt
      - type: file
        path: hikvision-linux.sh
      - type: file
        path: io.github.rwnicholas.HikvisionLinux.desktop
      - type: file
        path: io.github.rwnicholas.HikvisionLinux.svg
      - type: file
        path: ../io.github.rwnicholas.HikvisionLinux.appdata.xml
